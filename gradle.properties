org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

java_version=17

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Forge. The jar also runs on NeoForge 1.20.1, which reports itself as forge 47.1.x.
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=47.1.0"
# Verify NeoForge minimum with: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.5"
# Verify NeoForge with: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.106"
# Separate from minecraft_version so Fabric boundary checks do not change Forge.
forge_minecraft_version=1.20.1
forge_version=47.4.26
forge_version_range=[47.1.0,)
forge_loader_version_range=[47,)

# Fabric. The jar is compiled against minecraft_version and declares fabric_minecraft_version_range.
# Check 1.20 and the minimums with: ./gradlew :fabric:compileJava "-Pminecraft_version=1.20" "-Pfabric_api_version=0.83.0+1.20" "-Pfabric_loader_version=0.14.21"
# ./gradlew :fabric:compileJava "-Pminecraft_version=1.20.1" "-Pfabric_api_version=0.83.0+1.20.1" "-Pfabric_loader_version=0.14.21"
# Use the artifact for the Minecraft version: 0.83.0+1.20 metadata excludes 1.20.1.
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.14.21
fabric_api_version=0.92.12+1.20.1
# Minimum Fabric API. Build metadata (+1.20) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.83.0
fabric_minecraft_version_range=>=1.20 <=1.20.1
fabric_minecraft_label=1.20-1.20.1

# NightConfig is shipped by Forge; the common module compiles against the version of Forge 47.1.0 and the Fabric jar bundles it.
night_config_version=3.6.4

mod_id=feedbabyvillagers
mod_name=Feed Baby Villagers
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.feedbabyvillagers
