modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/feedbabyvillagers/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/feedbabyvillagers"
authors="emberbocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Feed baby villagers to speed up their growth with configurable foods.
Only needed on the server: players without the mod can join and see the vanilla particles and hear the sound.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
